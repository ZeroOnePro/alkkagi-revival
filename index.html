<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>알까기 온라인 - 비공식 복각 프로토타입</title><style>body{margin:0;background:#101820;color:#e9efe9;font-family:system-ui,-apple-system,sans-serif;text-align:center}header{padding:12px 8px 0}h1{font-size:22px;margin:5px}small{opacity:.65}.bar{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px auto;max-width:750px}button,select{background:#20333a;color:#fff;border:1px solid #58716b;border-radius:10px;padding:10px 12px;font-size:14px}button:active{background:#466657}.active{background:#28634e}#board{width:min(94vw,650px);aspect-ratio:1;background:#d4ae6b;border:7px solid #80613b;touch-action:none;border-radius:3px;box-sizing:border-box;display:block;margin:8px auto;box-shadow:0 12px 45px #0008}#status{font-weight:700;min-height:25px;margin:9px}#hint{font-size:13px;opacity:.8;max-width:700px;margin:10px auto;padding:0 12px}footer{font-size:11px;opacity:.5;padding:12px}#score{display:flex;gap:20px;justify-content:center;font-size:16px}</style></head><body><header><h1>⚫ 알까기 온라인: REVIVAL ⚪</h1><small>2011년 게임의 규칙을 바탕으로 만든 비공식 복각 시제품 · 원본 게임 아님</small></header><div class="bar"><select id="mode"><option value="ai">혼자하기 (AI 대전)</option><option value="local">2인 한 기기 대전</option></select><select id="map"><option value="basic">기본맵</option><option value="tire">타이어맵</option><option value="bomb">폭탄맵</option><option value="drain">하수구맵</option></select><select id="form"><option value="W">W자 포진</option><option value="M">M자 포진</option><option value="U">U자 포진</option><option value="line">일자 포진</option></select><button id="reset">새 경기</button><button id="sound" aria-label="효과음 켜기 또는 끄기">🔊 효과음 ON</button></div><div id="score"><span id="black">⚫ 흑 5</span><span id="white">⚪ 백 5</span></div><div id="status">흑돌 차례</div><canvas id="board" width="760" height="760"></canvas><div id="hint">내 돌을 누른 뒤 <b>쏘고 싶은 방향의 반대로</b> 당겼다가 놓으세요. 돌이 완전히 멈추면 다음 턴입니다. 흑 선공.</div><footer>오프라인 단일 HTML · 19×19 바둑판 · 물리 충돌 · 4가지 맵/포진 · AI/로컬 대전 · 원본 이미지·음원 미사용</footer><script>
const c=document.querySelector('#board'),g=c.getContext('2d'),S=760,pad=43,N=18,step=(S-pad*2)/N,rad=step*.39;const $=id=>document.getElementById(id);let stones=[],objects=[],turn=0,busy=false,drag=null,animation=false,tick=0,lastHit=0;let map='basic',mode='ai';
// iOS Safari: AudioContext must be resumed from a user gesture.
const Sound=(()=>{let ctx=null,enabled=true,lastCollision=0,shotLoss=0,won=false;
  function ready(){if(!enabled)return null;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx}catch{return null}}
  function tone(freq,duration=0.08,volume=0.12,type='sine',bend=0){const a=ready();if(!a||a.state!=='running')return;const now=a.currentTime,o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(25,freq),now);if(bend)o.frequency.exponentialRampToValueAtTime(Math.max(25,freq+bend),now+duration);v.gain.setValueAtTime(Math.max(0.0001,volume),now);v.gain.exponentialRampToValueAtTime(0.0001,now+duration);o.connect(v);v.connect(a.destination);o.start(now);o.stop(now+duration+.01)}
  function noise(duration=0.07,volume=.13,cutoff=1500){const a=ready();if(!a||a.state!=='running')return;const len=Math.max(1,Math.floor(a.sampleRate*duration)),buffer=a.createBuffer(1,len,a.sampleRate),d=buffer.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-5*i/len);const src=a.createBufferSource(),filter=a.createBiquadFilter(),v=a.createGain();src.buffer=buffer;filter.type='bandpass';filter.frequency.value=cutoff;filter.Q.value=.75;v.gain.value=volume;src.connect(filter);filter.connect(v);v.connect(a.destination);src.start()}
  return {unlock:ready,toggle(){enabled=!enabled;if(enabled)ready();return enabled},reset(){shotLoss=0;won=false},shot(){shotLoss=0;tone(245,.065,.09,'triangle',-110);noise(.035,.04,920)},hit(velocity){const now=performance.now();if(now-lastCollision<55)return;lastCollision=now;let strength=Math.min(1,Math.max(.13,velocity/13));noise(.075,.09*strength,1100+strength*2100);tone(420+strength*300,.038,.055*strength,'triangle',-240)},fall(){shotLoss++;tone(265,.16,.12,'triangle',-195);noise(.12,.075,520);if(shotLoss>=2){setTimeout(()=>{tone(640,.09,.10,'square',260);setTimeout(()=>tone(970,.18,.09,'sine'),90)},85);shotLoss=-100}},win(isPlayer){if(won)return;won=true;const notes=isPlayer?[523,659,784,1047]:[440,349,294,220];notes.forEach((n,i)=>setTimeout(()=>tone(n,.20,.09,'triangle',-45),i*115))}}})();
document.addEventListener('pointerdown',()=>Sound.unlock(),{passive:true});
$('sound').onclick=()=>{const enabled=Sound.toggle();$('sound').textContent=enabled?'🔊 효과음 ON':'🔇 효과음 OFF'};
const pos=(ix,iy)=>({x:pad+ix*step,y:pad+iy*step});
function setup(){map=$('map').value;mode=$('mode').value;stones=[];objects=[];turn=0;busy=false;drag=null;animation=false;tick=0;Sound.reset();const form=$('form').value;let offsets={line:[0,0,0,0,0],W:[-1,1,-1,1,-1],M:[1,-1,1,-1,1],U:[-1,0,1,0,-1]}[form];for(let team=0;team<2;team++){for(let i=0;i<5;i++){const p=pos(4.5+i*2.25,team===0?14+offsets[i]*.8:4-offsets[i]*.8);stones.push({x:p.x,y:p.y,vx:0,vy:0,t:team,alive:true,r:rad,teleport:0});}}if(map==='tire'){for(const [x,y] of [[3,3],[15,3],[9,9],[3,15],[15,15]]){let p=pos(x,y);objects.push({type:'tire',...p,r:rad*1.4,hp:10})}}if(map==='bomb'){for(let i=0;i<5;i++){let p=pos(5+i*2,9);objects.push({type:'bomb',...p,r:rad*.9})}}if(map==='drain'){for(const [x,y] of [[2,2],[16,2],[2,16],[16,16]]){objects.push({type:'drain',...pos(x,y),r:rad*1.55})}} update();draw();}
function update(){let a=stones.filter(s=>s.alive&&s.t===0).length,b=stones.filter(s=>s.alive&&s.t===1).length;$('black').textContent=`⚫ 흑 ${a}`;$('white').textContent=`⚪ 백 ${b}`;let msg=a===0||b===0?(a===b?'무승부!':a?'⚫ 흑 승리!':'⚪ 백 승리!'):busy?'돌 이동 중...':turn===0?'⚫ 흑돌 차례':mode==='ai'?'⚪ AI 생각 중...':'⚪ 백돌 차례';$('status').textContent=msg;if((a===0||b===0)&&!animation)Sound.win(a>0);}
function draw(){g.clearRect(0,0,S,S);g.fillStyle='#d6ad66';g.fillRect(0,0,S,S);g.strokeStyle='#644827';g.lineWidth=1.4;for(let i=0;i<=N;i++){let z=pad+i*step;g.beginPath();g.moveTo(pad,z);g.lineTo(S-pad,z);g.moveTo(z,pad);g.lineTo(z,S-pad);g.stroke()}g.fillStyle='#664a2a';for(const x of [3,9,15])for(const y of [3,9,15]){let p=pos(x,y);g.beginPath();g.arc(p.x,p.y,4,0,7);g.fill()}for(let o of objects){if(o.dead)continue;g.save();g.translate(o.x,o.y);if(o.type==='tire'){g.fillStyle='#292d31';g.beginPath();g.arc(0,0,o.r,0,7);g.fill();g.fillStyle='#b6a78b';g.beginPath();g.arc(0,0,o.r*.5,0,7);g.fill();g.fillStyle='#31363a';g.beginPath();g.arc(0,0,o.r*.27,0,7);g.fill()}else if(o.type==='bomb'){g.fillStyle='#a62e28';g.beginPath();g.arc(0,0,o.r,0,7);g.fill();g.font='18px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='white';g.fillText('✹',0,1)}else{g.fillStyle='#344d47';g.beginPath();g.arc(0,0,o.r,0,7);g.fill();g.fillStyle='#172b26';g.beginPath();g.arc(0,0,o.r*.75,0,7);g.fill();}g.restore()}for(let s of stones){if(!s.alive)continue;let q=g.createRadialGradient(s.x-s.r*.3,s.y-s.r*.4,1,s.x,s.y,s.r);if(s.t===0){q.addColorStop(0,'#777');q.addColorStop(.5,'#292d32');q.addColorStop(1,'#08090b')}else{q.addColorStop(0,'#fff');q.addColorStop(.7,'#e4e6df');q.addColorStop(1,'#9ea49e')}g.shadowColor='#37271588';g.shadowBlur=5;g.shadowOffsetY=3;g.fillStyle=q;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();g.shadowBlur=0;g.shadowOffsetY=0;if(drag?.s===s){g.strokeStyle='#ed6b28';g.lineWidth=3;g.stroke()}}
if(drag){let d=drag,dx=d.s.x-d.x,dy=d.s.y-d.y,dist=Math.hypot(dx,dy),amp=Math.min(dist,step*5);if(dist){g.strokeStyle='#f25b32';g.lineWidth=5;g.beginPath();g.moveTo(d.s.x,d.s.y);g.lineTo(d.s.x+dx/dist*amp*1.4,d.s.y+dy/dist*amp*1.4);g.stroke();g.fillStyle='#f25b32';g.beginPath();g.arc(d.s.x+dx/dist*amp*1.4,d.s.y+dy/dist*amp*1.4,6,0,7);g.fill()}}}
function coords(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*S/r.width,y:(e.clientY-r.top)*S/r.height}}c.addEventListener('pointerdown',e=>{if(busy||animation||mode==='ai'&&turn===1)return;let p=coords(e),s=stones.find(s=>s.alive&&s.t===turn&&Math.hypot(s.x-p.x,s.y-p.y)<s.r*1.8);if(!s)return;drag={s,...p};c.setPointerCapture(e.pointerId);draw()});c.addEventListener('pointermove',e=>{if(drag){Object.assign(drag,coords(e));draw()}});c.addEventListener('pointerup',e=>{if(!drag)return;const d=drag,p=coords(e);let dx=d.s.x-p.x,dy=d.s.y-p.y,dist=Math.hypot(dx,dy);drag=null;if(dist<8){draw();return}shoot(d.s,dx,dy);});c.addEventListener('pointercancel',()=>{drag=null;draw()});
function shoot(s,dx,dy){const dist=Math.hypot(dx,dy);if(dist<1)return;let speed=Math.min(dist,step*5)/ (step*5)*16;s.vx=dx/dist*speed;s.vy=dy/dist*speed;busy=true;lastHit=0;Sound.shot();update();if(!animation){animation=true;requestAnimationFrame(frame)}}
function collisions(){for(let i=0;i<stones.length;i++){let a=stones[i];if(!a.alive)continue;for(let j=i+1;j<stones.length;j++){let b=stones[j];if(!b.alive)continue;let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(dist>=min)continue;let nx=dx/dist,ny=dy/dist,overlap=(min-dist)/2;a.x-=nx*overlap;b.x+=nx*overlap;a.y-=ny*overlap;b.y+=ny*overlap;let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){if(-rel>.7)Sound.hit(-rel);let impulse=-(1+.88)*rel/2;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}}}for(let s of stones){if(!s.alive)continue;for(let o of objects){if(o.dead)continue;let dx=s.x-o.x,dy=s.y-o.y,dist=Math.hypot(dx,dy)||.01;if(o.type==='drain'){if(s.teleport<=0&&dist<o.r*.75){let dest=objects.find(v=>v.type==='drain'&&Math.abs(v.x-(S-o.x))<5&&Math.abs(v.y-(S-o.y))<5);if(dest){s.x=dest.x+(s.vx>0?1:-1)*o.r*1.2;s.y=dest.y+(s.vy>0?1:-1)*o.r*1.2;s.teleport=35}}continue}if(dist>=s.r+o.r)continue;if(o.type==='bomb'){Sound.hit(12);o.dead=true;s.alive=false;for(let x of stones)if(x.alive&&Math.hypot(x.x-o.x,x.y-o.y)<o.r*2.4)x.alive=false;continue}let nx=dx/dist,ny=dy/dist,v=s.vx*nx+s.vy*ny;s.x=o.x+nx*(s.r+o.r);s.y=o.y+ny*(s.r+o.r);if(v<0){Sound.hit(-v);s.vx-=2.5*v*nx;s.vy-=2.5*v*ny;o.hp--;if(o.hp<=0)o.dead=true}}}}
function frame(){for(let k=0;k<3;k++){for(let s of stones){if(!s.alive)continue;s.x+=s.vx/3;s.y+=s.vy/3;s.vx*=.992;s.vy*=.992;if(s.teleport>0)s.teleport--;if(s.x<pad-step*.4||s.x>S-pad+step*.4||s.y<pad-step*.4||s.y>S-pad+step*.4){s.alive=false;s.vx=s.vy=0;Sound.fall()}}collisions()}draw();if(stones.some(s=>s.alive&&Math.hypot(s.vx,s.vy)>.12)&&tick++<3000){requestAnimationFrame(frame);return}for(let s of stones){s.vx=0;s.vy=0}animation=false;busy=false;let a=stones.some(s=>s.alive&&s.t===0),b=stones.some(s=>s.alive&&s.t===1);if(a&&b){turn=1-turn;update();if(mode==='ai'&&turn===1)setTimeout(aiMove,450)}else update()}
function aiMove(){if(turn!==1||busy||mode!=='ai')return;let mine=stones.filter(s=>s.alive&&s.t===1),enemy=stones.filter(s=>s.alive&&s.t===0);if(!mine.length||!enemy.length)return;let best=null,score=-1e9;for(let m of mine)for(let e of enemy){let dx=e.x-m.x,dy=e.y-m.y,d=Math.hypot(dx,dy);let border=Math.min(e.x-pad,S-pad-e.x,e.y-pad,S-pad-e.y);let val=(300-d)*.17+(110-border)*.35+Math.random()*35;if(val>score){best={m,dx,dy,d};score=val}}let error=(Math.random()-.5)*.19,cos=Math.cos(error),sin=Math.sin(error),dx=best.dx*cos-best.dy*sin,dy=best.dx*sin+best.dy*cos;let mag=Math.hypot(dx,dy),power=step*(2.6+Math.random()*2);shoot(best.m,dx/mag*power,dy/mag*power)}
$('reset').onclick=setup;$('mode').onchange=setup;$('map').onchange=setup;$('form').onchange=setup;setup();
</script></body></html>
